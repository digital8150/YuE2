<VirtualHost *:80>
    ServerName yue.codingbot.kr
    DocumentRoot /var/www/yue-acme
    ProxyRequests Off
    ProxyPass /.well-known/acme-challenge/ !
    <Directory /var/www/yue-acme>
        Require all granted
    </Directory>
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://yue.codingbot.kr%{REQUEST_URI} [R=301,L]
    ErrorLog ${APACHE_LOG_DIR}/yue.codingbot.kr-error.log
    CustomLog ${APACHE_LOG_DIR}/yue.codingbot.kr-access.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerName yue.codingbot.kr
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/yue.codingbot.kr/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/yue.codingbot.kr/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyTimeout 600
    ProxyPass / http://127.0.0.1:7860/ upgrade=websocket
    ProxyPassReverse / http://127.0.0.1:7860/
    RequestHeader set X-Forwarded-Proto "https"

    ErrorLog ${APACHE_LOG_DIR}/yue.codingbot.kr-error.log
    CustomLog ${APACHE_LOG_DIR}/yue.codingbot.kr-access.log combined
</VirtualHost>
