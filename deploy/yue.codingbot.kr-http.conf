<VirtualHost *:80>
    ServerName yue.codingbot.kr
    DocumentRoot /var/www/yue-acme
    ProxyRequests Off
    ProxyPass /.well-known/acme-challenge/ !
    <Directory /var/www/yue-acme>
        Require all granted
    </Directory>
    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:7860/ upgrade=websocket
    ProxyPassReverse / http://127.0.0.1:7860/
    ErrorLog ${APACHE_LOG_DIR}/yue.codingbot.kr-error.log
    CustomLog ${APACHE_LOG_DIR}/yue.codingbot.kr-access.log combined
</VirtualHost>
